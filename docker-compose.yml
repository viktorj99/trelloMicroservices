services:
    users-service:
        build:
            context: ./Backend
            dockerfile: users-service/Dockerfile
        ports:
            - "8081:8080"
            - "50051:50051"
        environment:
            - MONGO_DB_URI=mongodb://host.docker.internal:27017
            - PORT=8080
        networks:
            - app-network

    projects-service:
        build:
            context: ./Backend
            dockerfile: projects-service/Dockerfile
        ports:
            - "8082:8080"
        environment:
            - MONGO_DB_URI=mongodb://host.docker.internal:27017
            - PORT=8080
        networks:
            - app-network

    tasks-service:
        build: ./Backend/tasks-service
        ports:
            - "8083:8080"
        environment:
            - MONGO_DB_URI=mongodb://host.docker.internal:27017
            - PORT=8080
        networks:
            - app-network
        volumes:
            - ./Backend/tasks-service/.env:/app/.env

    api-gateway:
        build:
            context: ./Backend/api-gateway
            dockerfile: Dockerfile
        ports:
            - "8080:8080"
        environment:
            - USER_SERVICE=http://users-service:8080/
            - PROJECT_SERVICE=http://projects-service:8080/
            - TASK_SERVICE=http://tasks-service:8080/
            - PORT=8080
        networks:
            - app-network
        volumes:
            - ./Backend/api-gateway/.env:/app/.env
        depends_on:
            - users-service
            - projects-service
            - tasks-service

    frontend:
        build:
            context: ./Frontend
            dockerfile: Dockerfile
        ports:
            - "5173:5173"
        env_file:
            - ./Frontend/.env
        networks:
            - app-network
        depends_on:
            - users-service
            - projects-service
            - tasks-service

networks:
    app-network:
        driver: bridge
