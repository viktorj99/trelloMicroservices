services:
    users-service:
        build:
            context: ./Backend
            dockerfile: users-service/Dockerfile
        ports:
            - "8081:8080"
            - "50051:50051"
        env_file:
            - ./Backend/users-service/.env
        networks:
            - app-network

    projects-service:
        build:
            context: ./Backend
            dockerfile: projects-service/Dockerfile
        ports:
            - "8082:8080"
        env_file:
            - ./Backend/projects-service/.env
        networks:
            - app-network

    tasks-service:
        build: ./Backend/tasks-service
        ports:
            - "8083:8080"
        env_file:
            - ./Backend/tasks-service/.env
        networks:
            - app-network
        volumes:
            - ./Backend/tasks-service/.env:/app/.env

    frontend:
        build:
            context: ./Frontend
            dockerfile: Dockerfile
        ports:
            - "5173:5173"
        env_file:
            - ./Frontend/.env
        networks:
            - app-network
        depends_on:
            - users-service
            - projects-service
            - tasks-service

networks:
    app-network:
        driver: bridge
