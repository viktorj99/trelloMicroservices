services:
    users-service:
        build:
            context: ./Backend
            dockerfile: users-service/Dockerfile
        ports:
            - "8081:8080"
            - "50051:50051"
        environment:
            - MONGO_DB_URI=mongodb://host.docker.internal:27017
            - PORT=8080
        networks:
            - app-network

    projects-service:
        build:
            context: ./Backend
            dockerfile: projects-service/Dockerfile
        ports:
            - "8082:8080"
        environment:
            - MONGO_DB_URI=mongodb://host.docker.internal:27017
            - PORT=8080
        networks:
            - app-network

    tasks-service:
        build: ./Backend/tasks-service
        ports:
            - "8083:8080"
        environment:
            - MONGO_DB_URI=mongodb://host.docker.internal:27017
            - PORT=8080
        networks:
            - app-network
        volumes:
            - ./Backend/tasks-service/.env:/app/.env
    
    notifications-service:
        build:
            context: ./Backend
            dockerfile: notifications-service/Dockerfile
        ports:
            - "8084:8080"
        env_file:
            - ./Backend/notifications-service/.env
        networks:
            - app-network

    cassandra:
        image: cassandra
        restart: always
        ports:
         - "9042:9042"
        # Docker healtcheck - checks if database is "alive"
        healthcheck:
            test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
            interval: 15s
            timeout: 5s
            retries: 15
        volumes:
        - cass_store:/var/lib/cassandra/data

    frontend:
        build:
            context: ./Frontend
            dockerfile: Dockerfile
        ports:
            - "5173:5173"
        env_file:
            - ./Frontend/.env
        networks:
            - app-network
        depends_on:
            - users-service
            - projects-service
            - tasks-service

networks:
    app-network:
        driver: bridge


volumes:
  cass_store: