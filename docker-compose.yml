services:
    users-service:
        build:
            context: ./Backend
            dockerfile: users-service/Dockerfile
        ports:
            - "8081:8080"
            - "8444:8443" # HTTPS
            - "50051:50051"
        environment:
            - MONGO_DB_URI=mongodb://host.docker.internal:27017
            - PORT=8080
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            #- CONSUL_HTTP_ADDR=consul:8500  # Add Consul address to env
        networks:
            - app-network
        volumes:
            - ./certificates:/app/certificates 

    projects-service:
        build:
            context: ./Backend
            dockerfile: projects-service/Dockerfile
        ports:
            - "8082:8080"
            - "8445:8443" # HTTPS
        environment:
            - MONGO_DB_URI=mongodb://host.docker.internal:27017
            - PORT=8080
        networks:
            - app-network
        volumes:
            - ./certificates:/app/certificates 

    tasks-service:
        build:
            context: ./Backend
            dockerfile: tasks-service/Dockerfile
        ports:
            - "8083:8080"
            - "8446:8443" # HTTPS
        environment:
            - MONGO_DB_URI=mongodb://host.docker.internal:27017
            - PORT=8080
        networks:
            - app-network
        volumes:
            - ./certificates:/app/certificates 

    api-gateway:
        build:
            context: ./Backend/api-gateway
            dockerfile: Dockerfile
        ports:
            - "8080:8080"
            - "8443:8443" # HTTPS
        environment:
            - USER_SERVICE=https://users-service:8443
            - PROJECT_SERVICE=https://projects-service:8443 # HTTPS URL projects-service-a
            - TASK_SERVICE=https://tasks-service:8443 # HTTPS URL tasks-service-a
            - PORT=8443
        networks:
            - app-network
        volumes:
            - ./certificates:/app/certificates
        depends_on:
            - users-service
            - projects-service
            - tasks-service

    redis:
        image: "redis:latest"
        ports:
            - "6379:6379"
        networks:
            - app-network

    # consul:
    #     image: "consul:1.14.2"
    #     ports:
    #         - "8500:8500"
    #     networks:
    #         - app-network
    #     command: "agent -dev -client=0.0.0.0"  # Run in dev mode to allow easy access
    
    frontend:
        build:
            context: ./Frontend
            dockerfile: Dockerfile
        ports:
            - "5173:5173"
        volumes:
            - ./certificates:/app/certificates
        env_file:
            - ./Frontend/.env
        networks:
            - app-network
        depends_on:
            - users-service
            - projects-service
            - tasks-service

networks:
    app-network:
        driver: bridge
